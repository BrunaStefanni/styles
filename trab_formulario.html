<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Contacto</title>
    
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Style-->
    <style>
        
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #173b55;
        }

    </style>

</head>
<body>
    <!-- Formulário de contacto -->
    <section id="contacto" class="mb-5">
        <h2>Contacto</h2>
        <form>
            <div class="mb-3">
                <label for="nome" class="form-label">Nome</label>
                <input type="text" id="nome" class="form-control" placeholder="O teu nome">
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" class="form-control" placeholder="O teu email">                </div>

            <div class="mb-3">
                <label for="mensagem" class="form-label">Mensagem</label>
                <textarea id="mensagem" class="form-control" rows="4" placeholder="Escreve a tua mensagem"></textarea>
            </div>
                <button type="submit" class="btn btn-primary">Enviar</button>
            </form>
        </section>
</body>
</html>
