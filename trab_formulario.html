<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Contacto</title>
    
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Style-->
    <style>

        /* Configuração geral */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #173b55;
            background: /* Imagem com degradê azul por cima */
            linear-gradient(135deg,rgba(0, 40, 80, 0.75), rgba(0, 160, 200, 0.45)), url("imagens\ trab/tuga.avif");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            min-height: 100vh;
            display: flex;
            flex-direction: column;

        }


        /* Cabeçalho */
        .cabecalho {
            background: linear-gradient(90deg, #006994, #00a6c7);
            color: white;
            text-align: center;
            padding: 25px 15px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
        }

        .cabecalho h1 {
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .cabecalho p {
            margin: 0;
            font-size: 16px;
        }

        /* Área principal */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 15px;
        }
   
        /* Caixa do formulário */
        .caixa-contacto {
            background-color: white;
            width: 100%;
            max-width: 600px;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0, 70, 100, 0.15);

            /* Posição da caixa*/
            position: absolute;
            top: 150px;   /* Distância do topo */
            left: 140px; /* Distância da esquerda */
        }

        /* Título do formulário */
        .caixa-contacto h2 {
            text-align: center;
            color: #0077a8;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .descricao {
            text-align: center;
            color: #66808f;
            margin-bottom: 30px;
        }

        /* Etiquetas dos campos */
        .form-label {
            font-weight: bold;
            color: #173b55;
            margin-bottom: 8px;
        }

        /* Campos de preenchimento */
        .form-control {
            border: 1px solid #c5dce6;
            border-radius: 9px;
            padding: 12px;
            transition: 0.3s;
        }

        .form-control:focus {
            border-color: #00a6c7;
            box-shadow: 0 0 0 0.2rem rgba(0, 166, 199, 0.18);
        }

        textarea.form-control {
            resize: vertical;
        }

        /* Botão de envio */
        .btn-enviar {
            background-color: #0077a8;
            color: white;
            border: none;
            border-radius: 9px;
            padding: 12px;
            width: 100%;
            font-size: 17px;
            font-weight: bold;
            margin-top: 10px;
            transition: 0.3s;
        }

        .btn-enviar:hover {
            background-color: #005577;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 12px rgba(0, 85, 119, 0.2);
        }

        /* Ligação para voltar */
        .voltar {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #0077a8;
            text-decoration: none;
            font-weight: bold;
        }

        .voltar:hover {
            color: #005577;
            text-decoration: underline;
        }

        /* Rodapé */
        footer {
            background-color: #005577;
            color: white;
            text-align: center;
            padding: 16px;
        }

        footer p {
            margin: 0;
        }

        /* Adaptação a telemóveis */
        @media (max-width: 576px) {
            .caixa-contacto {
                padding: 25px 20px;
            }

            .cabecalho h1 {
                font-size: 25px;
            }
        }
    </style>

</head>
<body>

    <!-- Cabeçalho -->
    <header class="cabecalho">
        <h1>Planeta +Azul +vivo</h1>
        <p>Proteger a vida marinha, preservar o futuro.</p>
    </header>

    <!-- Formulário de contacto -->
    <main>
        <section id="contacto" class="caixa-contacto">

        <h2>Entrar em contacto</h2>
            <p class="descricao">Preencha seus dados para enviar uma mensagem.</p>

            <form action="#" method="post">
                <div class="mb-3">
                    <label for="nome" class="form-label">Nome</label>
                    <input type="text" id="nome" name="nome" class="form-control" placeholder="Escreve o teu nome" autocomplete="name" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="exemplo@email.com" autocomplete="email" required>
                </div>

                <div class="mb-4">
                    <label for="mensagem" class="form-label">Mensagem</label>
                    <textarea id="mensagem" name="mensagem" class="form-control" rows="5" placeholder="Escreve aqui a tua mensagem..." required></textarea>
                </div>

                <button type="submit" class="btn btn-enviar">Enviar mensagem</button>

            </form>

            <a href="trabalho.html" class="voltar"> ← Voltar à página inicial</a>

        </section>
    </main>

    <!-- Rodapé -->
    <footer>
        <p>Planeta +Azul +Vivo — Proteger os nossos oceanos 🌍</p>
    </footer>

</body>
</html>
