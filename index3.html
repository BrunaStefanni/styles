<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de HTML e CSS</title>
    
    <style>
        /* Aplicação direta no seletor */
        p {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 16px;
            color: #333;
        }

        /* Aplicação de classes */
        .destaque {
            background-color: yellow;
            padding: 10px;
            border: 1px solid #ccc;
        }

        /* Aplicação de IDs */
        #cabecalho {
            font: size 24px;
            color: blue;
            text-align: center;
        }

    </style>

</head>

<body>
    
    <!--Elemento com ID-->
    <h1 id="cabecalho">Bem-vindo ao meu site</h1>

    <!--Elemento com classe-->
    <p class="destaque"> Este é um parágrafo com a classe "destaque". Tem fundo amarelo e um pouco de padding.</p>

    <!--Aplicação direta ao seletor-->
    <p> Este é um parágrafo normal, sem classe ou ID. Esta formatado pelo seletor "p" no CSS.</p>
    
    <!--Outros elementos com classe-->
    <div class="destaque">
        Esta é uma div com a classe "destaque". Tem fundo amarelo e um pouco de padding.
    </div>

</body>

</html>
