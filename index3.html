<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de HTML e CSS</title>
    <style>

    </style>
</head>

<body>
    
    <!--Elemento com ID-->
    <h1>Bem-vindo ao meu site</h1>

    <!--Elemento com classe-->
    <p class="destaque"> Este é um parágrafo com a classe "destaque". Tem fundo amarelo e um pouco de padding.</p>

    <!--Aplicação direta ao seletor-->
    <p> Este é um parágrafo normal, sem classe ou ID. Esta formatado pelo seletor "p" no CSS.</p>
    
    <!--Outros elementos com classe-->
    <div>
        Esta é uma div com a classe "destaque". Tem fundo amarelo e um pouco de padding.
    </div>

</body>

</html>
